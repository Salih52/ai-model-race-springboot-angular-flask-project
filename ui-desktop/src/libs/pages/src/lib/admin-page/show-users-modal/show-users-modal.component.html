<header class="d-flex justify-content-between align-items-center my-4">
    <h1>Sisteme Kayıtlı Öğrenciler</h1>
    <button class="btn btn-info" (click)="exportExcel()">Excele Dönüştür</button>
  </header>
  <input type="text" class="form-control" [(ngModel)]="filterText" placeholder="Kullanıcı Ara..">
  <br>
  <div *ngIf="users.length != 0; else noScoreList">
    <table class="table table-striped">
      <thead class="thead-dark">
        <tr>
          <th>Öğrenci No</th>
          <th>Ad</th>
          <th>Soyad</th>
          <th>E-mail</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users | userFilter : filterText">
          <td>{{ user.schoolNo }}</td>
          <td>{{ user.firstName }}</td>
          <td>{{ user.lastName }}</td>
          <td>{{ user.email }}</td>
          <td><button [routerLink]="'admin/users/'+user.schoolNo" (click)="closeModal()" class="btn btn-sm btn-primary">Profili Görüntüle</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <ng-template #noScoreList>
    <h1>Sisteme Kayıtlı Öğrenci Bulunmamaktadır...</h1>
  </ng-template>
