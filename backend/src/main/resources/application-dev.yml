spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
      file-size-threshold: 0

server:
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 500MB
    connection-timeout: 300s
  undertow:
    max-http-post-size: 500MB
logging:
  level:
    org:
      springframework:
        security: debug

flask:
  api:
    url: "http://127.0.0.1:5000/veriAl"